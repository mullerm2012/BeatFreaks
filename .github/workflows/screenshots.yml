# EXPERIMENTAL: takes screenshots of the real BeatFreaks app for the manual
# and website. Run by hand: Actions -> "BeatFreaks screenshots" -> Run workflow.
#
# GitHub-hosted Windows runners may not have a visible desktop, so every
# picture is checked before it counts:
#   - the program is the one this MSI just installed (its install folder is
#     read from the MSI log; product names checked below),
#   - the process is still running and has a visible main window,
#   - the window is captured with PrintWindow (works without a desktop),
#     and an image that is almost one colour is rejected as blank.
#   - the build is labelled from the MSI product AND the program's own
#     ProductName: "beatfreaks" only when both start with BeatFreaks,
#     "pre-rebrand-mixxx" when both say Mixxx (test captures, never
#     published as BeatFreaks UI); anything mixed or unknown stops the job.
#     The first step self-tests these rules.
# Pictures that pass go to "screenshots-verified-<label>" with IDENTITY.txt.
# Nothing goes into the manual until a person has looked at them.
name: BeatFreaks screenshots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Installer build run ID (empty = newest successful 'BeatFreaks Windows installer' run on main)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Product check self-test
        shell: pwsh
        run: |
          @'
          # Decides which product a build is. Both the MSI and the program
          # itself must agree; anything contradictory is refused.
          function Get-BuildLabel([string]$MsiProduct, [string]$ExeProduct) {
            $msiBF = $MsiProduct -match '^BeatFreaks'
            $exeBF = $ExeProduct -match '^BeatFreaks'
            $msiMx = $MsiProduct -match '^Mixxx'
            $exeMx = $ExeProduct -match '^Mixxx'
            if ($msiBF -and $exeBF) { return "beatfreaks" }
            if ($msiMx -and $exeMx) { return "pre-rebrand-mixxx" }
            throw "Inconsistent or unknown product: MSI '$MsiProduct', program '$ExeProduct'"
          }
          '@ | Set-Content "$env:RUNNER_TEMP\label.ps1"
          . "$env:RUNNER_TEMP\label.ps1"
          $cases = @(
            @{ msi = "BeatFreaks"; exe = "BeatFreaks"; want = "beatfreaks" },
            @{ msi = "Mixxx";      exe = "Mixxx";      want = "pre-rebrand-mixxx" },
            @{ msi = "BeatFreaks"; exe = "Mixxx";      want = "error" },
            @{ msi = "Mixxx";      exe = "BeatFreaks"; want = "error" },
            @{ msi = "BeatFreaks"; exe = "";           want = "error" },
            @{ msi = "";           exe = "BeatFreaks"; want = "error" },
            @{ msi = "Something";  exe = "Else";       want = "error" }
          )
          $failed = 0
          foreach ($c in $cases) {
            try { $got = Get-BuildLabel $c.msi $c.exe } catch { $got = "error" }
            $ok = $got -eq $c.want
            if (-not $ok) { $failed++ }
            Write-Host ("{0} MSI='{1}' program='{2}' -> {3} (want {4})" -f ($(if ($ok) {"PASS"} else {"FAIL"}), $c.msi, $c.exe, $got, $c.want))
          }
          if ($failed) { throw "$failed product-check case(s) failed" }

      - name: Find the installer build
        id: find
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          $id = $env:RUN_ID
          if (-not $id) {
            $id = gh run list -R ${{ github.repository }} --workflow "BeatFreaks Windows installer" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if (-not $id) { throw "No successful installer build found" }
          "run_id=$id" >> $env:GITHUB_OUTPUT
          Write-Host "Using installer from run $id"

      # The installer build uploads the .msi as-is (upload-artifact v7,
      # archive: false), which `gh run download` and download-artifact can't
      # unpack. Fetch it from the artifacts API directly; unzip only if it
      # turns out to be a zip.
      - name: Download the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "${{ steps.find.outputs.run_id }}"
          $arts = gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name | endswith(".msi")) | "\(.id) \(.name) \(.size_in_bytes)"'
          $arts = @($arts | Where-Object { $_ })
          if ($arts.Count -ne 1) { throw "Expected exactly one .msi artifact in run $run, found $($arts.Count)" }
          $id, $name, $size = $arts[0].Split(" ")
          Write-Host "Artifact $id $name ($size bytes)"
          # The API redirects to a short-lived storage address; PowerShell
          # follows it (and drops the token when it leaves api.github.com).
          New-Item -ItemType Directory -Force installer | Out-Null
          $out = "installer\download.bin"
          Invoke-WebRequest -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -OutFile $out -UseBasicParsing
          Write-Host "Downloaded $((Get-Item $out).Length) bytes"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $out))
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            Expand-Archive $out -DestinationPath installer -Force; Remove-Item $out
          } else {
            Move-Item $out "installer\$name" -Force
          }

      - name: Pick the installer
        shell: pwsh
        run: |
          Get-ChildItem installer -Recurse | ForEach-Object { Write-Host "downloaded: $($_.FullName) ($($_.Length) bytes)" }
          $msi = @(Get-ChildItem installer -Recurse -Filter *.msi)
          if ($msi.Count -ne 1) { throw "Expected exactly one .msi, found $($msi.Count)" }
          # An MSI is an OLE compound file: D0 CF 11 E0
          $head = [System.IO.File]::ReadAllBytes($msi[0].FullName)[0..3]
          if (-not ($head[0] -eq 0xD0 -and $head[1] -eq 0xCF -and $head[2] -eq 0x11 -and $head[3] -eq 0xE0)) { throw "Downloaded file is not an MSI" }
          Write-Host "Installer: $($msi[0].FullName)"
          "MSI=$($msi[0].FullName)" >> $env:GITHUB_ENV

      - name: Install silently and find the installed program
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$env:MSI`" /qn /norestart /l*v install.log" -Wait -PassThru
          Write-Host "msiexec exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "Install failed" }
          # Where did this MSI install to? Read it from its own log
          # (WiX/CPack uses INSTALL_ROOT), so we never pick another copy.
          $props = Select-String -Path install.log -Pattern 'Property\(S\): (INSTALL_ROOT|INSTALLDIR|INSTALLFOLDER|APPLICATIONFOLDER) = (.+)$'
          $props | ForEach-Object { Write-Host "MSI property: $($_.Matches[0].Groups[1].Value) = $($_.Matches[0].Groups[2].Value)" }
          $roots = @($props | ForEach-Object { $_.Matches[0].Groups[2].Value.Trim() } | Where-Object { Test-Path $_ } | Select-Object -Unique)
          if ($roots.Count -eq 0) {
            Get-ChildItem $env:ProgramFiles -Directory | ForEach-Object { Write-Host "Program Files: $($_.Name)" }
            throw "Could not find this MSI's install folder in install.log"
          }
          $candidates = @(foreach ($r in $roots) {
            Get-ChildItem $r -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(mixxx|beatfreaks)\.exe$' }
          })
          $candidates | ForEach-Object { Write-Host "found: $($_.FullName)" }
          if ($candidates.Count -ne 1) {
            $candidates | ForEach-Object { Write-Host "candidate: $($_.FullName)" }
            throw "Expected exactly one freshly installed program, found $($candidates.Count)"
          }
          $exe = $candidates[0]
          $info = $exe.VersionInfo
          # What the MSI says it installed ("Product: <name> -- Installation completed successfully.")
          $msiLine = Select-String -Path install.log -Pattern 'Product: (.+?) --' | Select-Object -Last 1
          $msiProduct = if ($msiLine) { $msiLine.Matches[0].Groups[1].Value } else { "" }
          Write-Host "MSI product='$msiProduct'  program=$($exe.FullName)  exe product='$($info.ProductName)' version='$($info.ProductVersion)'"
          # Label the build honestly (rules and self-test in the first step).
          . "$env:RUNNER_TEMP\label.ps1"
          $label = Get-BuildLabel $msiProduct $info.ProductName
          $brand = if ($label -eq "beatfreaks") { "BeatFreaks" } else { "Mixxx" }
          Write-Host "Build label: $label"
          New-Item -ItemType Directory -Force shots | Out-Null
          "msi_product=$msiProduct`nexe=$($exe.FullName)`nexe_product=$($info.ProductName)`nexe_version=$($info.ProductVersion)`nlabel=$label`ninstaller_run=${{ steps.find.outputs.run_id }}" | Set-Content shots\IDENTITY.txt
          "APP=$($exe.FullName)" >> $env:GITHUB_ENV
          "LABEL=$label" >> $env:GITHUB_ENV
          "BRAND=$brand" >> $env:GITHUB_ENV

      - name: Start the app and take checked screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win {
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint flags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@
          New-Item -ItemType Directory -Force shots, rejected | Out-Null
          Write-Host "Expecting $env:BRAND windows (label $env:LABEL)"
          $script:good = 0

          function Test-Content([System.Drawing.Bitmap]$bmp) {
            # Sample a grid; a real window has many different colours.
            $colors = @{}
            for ($x = 0; $x -lt $bmp.Width; $x += [Math]::Max(1, [int]($bmp.Width / 40))) {
              for ($y = 0; $y -lt $bmp.Height; $y += [Math]::Max(1, [int]($bmp.Height / 40))) {
                $colors[$bmp.GetPixel($x, $y).ToArgb()] = 1
              }
            }
            return $colors.Count
          }

          function Shot([System.Diagnostics.Process]$proc, [string]$name) {
            $proc.Refresh()
            if ($proc.HasExited) { Write-Host "::warning::$name - app has exited (code $($proc.ExitCode))"; return }
            $h = $proc.MainWindowHandle
            if ($h -eq [IntPtr]::Zero) { Write-Host "::warning::$name - no main window yet"; return }
            if (-not [Win]::IsWindowVisible($h)) { Write-Host "::warning::$name - main window not visible"; return }
            $r = New-Object Win+RECT
            [void][Win]::GetWindowRect($h, [ref]$r)
            $w = $r.Right - $r.Left; $hgt = $r.Bottom - $r.Top
            if ($w -lt 200 -or $hgt -lt 150) { Write-Host "::warning::$name - window too small ($w x $hgt)"; return }
            $bmp = New-Object System.Drawing.Bitmap $w, $hgt
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc()
            $ok = [Win]::PrintWindow($h, $hdc, 2)   # PW_RENDERFULLCONTENT
            $g.ReleaseHdc($hdc); $g.Dispose()
            $n = Test-Content $bmp
            $title = $proc.MainWindowTitle
            # The window must belong to the product we installed (dialogs on
            # first run may have their own titles, so only reject a clash).
            $other = if ($env:BRAND -eq "BeatFreaks") { "Mixxx" } else { "BeatFreaks" }
            $titleOk = -not ($title -match $other -and $title -notmatch $env:BRAND)
            if ($ok -and $n -ge 12 -and $titleOk) {
              $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
              "$name.png`t$w x $hgt`tcolours=$n`ttitle=$title" | Add-Content shots\CHECK.txt
              $script:good++
              Write-Host "OK $name ($w x $hgt, $n colours, '$title')"
            } else {
              $bmp.Save("rejected\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "::warning::$name rejected (PrintWindow=$ok, colours=$n, title='$title')"
            }
            $bmp.Dispose()
          }

          $music = "$env:RUNNER_TEMP\Music"
          New-Item -ItemType Directory -Force $music | Out-Null
          $proc = Start-Process $env:APP -PassThru
          Start-Sleep 25
          Shot $proc "01-first-start"
          # First run asks for the music folder. Type a path and press Enter.
          $proc.Refresh()
          if ($proc.MainWindowHandle -ne [IntPtr]::Zero) { [void][Win]::SetForegroundWindow($proc.MainWindowHandle) }
          [System.Windows.Forms.SendKeys]::SendWait($music); Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}"); Start-Sleep 15
          Shot $proc "02-after-folder"
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep 10
          Shot $proc "03-main-window"
          Start-Sleep 10
          Shot $proc "04-main-window-later"
          $proc.Refresh()
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'BeatFreaks|Mixxx' } | Copy-Item -Destination shots -ErrorAction SilentlyContinue
          Write-Host "Verified screenshots: $script:good"
          if ($script:good -eq 0) { throw "No screenshot passed the checks (see 'screenshots-rejected')" }

      - name: Upload verified screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-verified-${{ env.LABEL || 'unknown' }}
          path: |
            shots/
            install.log
          if-no-files-found: warn

      - name: Upload rejected screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-rejected
          path: rejected/
          if-no-files-found: ignore
